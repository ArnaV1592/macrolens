name: sos
on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 min, 24/7 (events break at night too)
  workflow_dispatch:
jobs:
  sos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install feedparser httpx groq psycopg2-binary
      - run: python sos.py
        env:
          SUPABASE_PG_DSN: ${{ secrets.SUPABASE_PG_DSN }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
